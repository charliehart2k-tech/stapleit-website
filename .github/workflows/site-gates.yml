name: Site quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate governing standards
        run: |
          files=(
            AGENTS.md
            STANDARDS-INDEX.md
            BRAND-PALETTE.md
            DESIGN-SYSTEM.md
            DESIGN-QUALITY-GATES.md
            DESIGN-BASELINES.json
            CODE-STANDARDS.md
            ASSET-STANDARDS.md
            SEO-AEO-SCHEMA.md
            RELEASE-CHECKLIST.md
            PRODUCTION-GATES.md
            DEPLOYMENT-NOTES.md
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "::error::$file is missing or empty"; exit 1; }
          done

      - name: Validate audit tools
        run: |
          python3 -m py_compile tools/audit-site.py
          python3 -m py_compile tools/audit-assets.py
          python3 -m py_compile tools/build-css.py
          python3 -m py_compile tools/build-wordpress-templates.py
          python3 -m py_compile tools/audit-repository.py
          python3 -m py_compile tools/audit-standards.py
          python3 -m py_compile tools/install-staging-nginx-hardening.py

      - name: Validate standards consistency
        run: python3 tools/audit-standards.py --root .

      - name: Scan repository for secrets and unsafe files
        run: python3 tools/audit-repository.py --root .

      - name: Verify generated CSS and performance budgets
        run: python3 tools/build-css.py --check

      - name: Compile and verify WordPress templates
        run: |
          template_root="$(mktemp -d)"
          python3 tools/build-wordpress-templates.py \
            --source-root site \
            --theme-root "$template_root" \
            --version ci-test
          test "$(find "$template_root" -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 18
          grep -Fq 'assets/css/home.bundle.css?v=ci-test' "$template_root/front-page.php"
          grep -Fq 'assets/css/it-support.bundle.css?v=ci-test' "$template_root/static-it-support.php"
          grep -Fq '<?php wp_head(); ?>' "$template_root/front-page.php"
          if rg -q 'fonts\.googleapis|fonts\.gstatic' "$template_root"; then
            echo "::error::compiled templates contain a third-party font dependency"
            exit 1
          fi

      - name: Validate shell tools
        run: |
          bash -n tools/deploy-wordpress-staging.sh
          bash -n tools/audit-vps.sh
          bash -n tools/prune-theme-backups.sh

      - name: Validate Nginx hardening baseline
        run: |
          test -s ops/nginx/stapleit-security-headers.conf
          test -s ops/nginx/stapleit-hardening.conf
          grep -Fq 'add_header Content-Security-Policy' ops/nginx/stapleit-security-headers.conf
          grep -Fq "frame-ancestors 'none'" ops/nginx/stapleit-security-headers.conf
          grep -Fq 'location = /.well-known/security.txt' ops/nginx/stapleit-hardening.conf
          grep -Fq 'location = /xmlrpc.php' ops/nginx/stapleit-hardening.conf
          grep -Fq 'max-age=31536000, immutable' ops/nginx/stapleit-hardening.conf
          if rg -q 'fonts\.(googleapis|gstatic)' ops/nginx; then
            echo "::error::Nginx CSP still contains retired Google Fonts allowances"
            exit 1
          fi

      - name: Test destructive path safeguards
        run: |
          if REPO="$PWD" WP_ROOT=/tmp/stapleit-wp THEME=/ \
            MU_PLUGINS_DIR=/tmp/stapleit-wp/wp-content/mu-plugins \
            WELL_KNOWN_DIR=/tmp/stapleit-wp/.well-known \
            BACKUP_DIR=/tmp/stapleit-backups \
            bash tools/deploy-wordpress-staging.sh; then
            echo "::error::deployment accepted an unsafe theme path"
            exit 1
          fi

      - name: Test rollback backup retention
        run: |
          backup_test_root="$(mktemp -d)"
          for stamp in \
            20260819-000001 20260819-000002 20260819-000003 \
            20260819-000004 20260819-000005 20260819-000006 \
            20260819-000007; do
            touch "$backup_test_root/stapleit-theme-$stamp.tar.gz"
            mkdir "$backup_test_root/static-templates-$stamp"
            touch "$backup_test_root/static-templates-$stamp/static-test.php"
            touch "$backup_test_root/stapleit-static-routes-$stamp.php"
          done
          BACKUP_DIR="$backup_test_root" BACKUP_RETENTION=5 \
            bash tools/prune-theme-backups.sh
          test "$(find "$backup_test_root" -maxdepth 1 -type f -name 'stapleit-theme-*.tar.gz' | wc -l)" -eq 5
          test "$(find "$backup_test_root" -maxdepth 1 -type d -name 'static-templates-*' | wc -l)" -eq 5
          test "$(find "$backup_test_root" -maxdepth 1 -type f -name 'stapleit-static-routes-*.php' | wc -l)" -eq 5

      - name: Validate WordPress PHP
        run: |
          php -l wordpress/functions.php
          php -l wordpress/cora-safety.php
          php -l wordpress/cora-knowledge.php
          php -l wordpress/mu-plugins/stapleit-static-routes.php
          php tests/php/cora-safety-test.php
          php tests/php/cora-knowledge-test.php

      - name: Run content security SEO and AEO gates
        run: python3 tools/audit-site.py --root site

      - name: Validate raster asset integrity
        run: python3 tools/audit-assets.py --root site/assets

  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned browser test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static source
        run: python3 -m http.server 4173 --directory site &
      - name: Verify reference viewports and component bounds
        run: npm run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: it-support-visual-contract
          path: test-results/it-support-*.png
          if-no-files-found: ignore
          retention-days: 14
