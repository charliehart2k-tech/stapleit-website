name: Site quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate governing standards
        run: |
          files=(
            AGENTS.md
            STANDARDS-INDEX.md
            BRAND-PALETTE.md
            DESIGN-SYSTEM.md
            CODE-STANDARDS.md
            ASSET-STANDARDS.md
            SEO-AEO-SCHEMA.md
            RELEASE-CHECKLIST.md
            PRODUCTION-GATES.md
            DEPLOYMENT-NOTES.md
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "::error::$file is missing or empty"; exit 1; }
          done

      - name: Validate audit tools
        run: |
          python3 -m py_compile tools/audit-site.py
          python3 -m py_compile tools/audit-assets.py

      - name: Validate shell tools
        run: |
          bash -n tools/deploy-wordpress-staging.sh
          bash -n tools/audit-vps.sh
          bash -n tools/prune-theme-backups.sh

      - name: Test rollback backup retention
        run: |
          backup_test_root="$(mktemp -d)"
          for stamp in \
            20260819-000001 20260819-000002 20260819-000003 \
            20260819-000004 20260819-000005 20260819-000006 \
            20260819-000007; do
            touch "$backup_test_root/stapleit-theme-$stamp.tar.gz"
            mkdir "$backup_test_root/static-templates-$stamp"
            touch "$backup_test_root/static-templates-$stamp/static-test.php"
            touch "$backup_test_root/stapleit-static-routes-$stamp.php"
          done
          BACKUP_DIR="$backup_test_root" BACKUP_RETENTION=5 \
            bash tools/prune-theme-backups.sh
          test "$(find "$backup_test_root" -maxdepth 1 -type f -name 'stapleit-theme-*.tar.gz' | wc -l)" -eq 5
          test "$(find "$backup_test_root" -maxdepth 1 -type d -name 'static-templates-*' | wc -l)" -eq 5
          test "$(find "$backup_test_root" -maxdepth 1 -type f -name 'stapleit-static-routes-*.php' | wc -l)" -eq 5

      - name: Validate WordPress PHP
        run: |
          php -l wordpress/functions.php
          php -l wordpress/mu-plugins/stapleit-static-routes.php

      - name: Run content security SEO and AEO gates
        run: python3 tools/audit-site.py --root site

      - name: Validate raster asset integrity
        run: python3 tools/audit-assets.py --root site/assets
