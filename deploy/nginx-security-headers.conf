# Include this file from the HTTPS server{} block.
# HSTS is intentionally disabled until HTTPS has been issued and verified.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.google.com; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; script-src 'self' 'sha256-uwP9zCjUMj4TaKsAJ7tBhNLUVndqQzHGGKwnMdyqvaE='; style-src 'self'; connect-src 'self'; worker-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

