# Include inside the Staple IT Nginx server block after installing both files
# under /etc/nginx/snippets/. Keep the existing PHP and WordPress locations.
server_tokens off;

include /etc/nginx/snippets/stapleit-security-headers.conf;

# Serve the published security contact directly from the WordPress document
# root. This avoids WordPress rewrite handling swallowing the well-known path.
location = /.well-known/security.txt {
    try_files $uri =404;
    default_type text/plain;
}

location = /xmlrpc.php {
    return 404;
}

location = /wp-config.php {
    return 404;
}

# Staging is deployed from Git. Keep the browser login surface closed while
# the site is under construction; admin-ajax.php remains available.
location = /wp-login.php {
    return 404;
}

location ~ /\.(?!well-known/) {
    deny all;
}

location ~* ^/wp-content/themes/stapleit/assets/.+\.(?:css|js|woff2|webp|png|jpg|jpeg|svg|ico|mp4)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/stapleit-security-headers.conf;
}
